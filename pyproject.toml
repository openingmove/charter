[project]
name = "charter"
version = "0.2.1"
description = "Schemas, validation and scaffolding for Markdown knowledge bases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.scripts]
charter = "charter.cli:run"
charter-hook = "charter.guard:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
